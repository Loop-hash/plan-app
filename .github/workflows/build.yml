name: Zbuduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Testy parsera
        run: npm ci && npm test

      - name: Projekt Androida
        run: |
          npx cap add android
          npx cap sync android
          # numer wersji rośnie z każdym buildem, więc aktualizacja instaluje się na starą wersję
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Stały klucz podpisu (żeby aktualizacje nie wymagały odinstalowania)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Plan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Plan-apk
          path: Plan.apk

      - name: Przesuń tag latest na ten commit
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Wydanie „najnowsza wersja”
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Plan — najnowsza wersja
          body: "Build #${{ github.run_number }} z commita ${{ github.sha }}. Pobierz **Plan.apk** na telefonie i zainstaluj."
          prerelease: false
          make_latest: true
          files: Plan.apk
