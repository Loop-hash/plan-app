name: Zbuduj APK

# Każdy push na main buduje apkę i wystawia ją jako wydanie "latest".
# Telefon sprawdza to wydanie: gdy część androidowa się nie zmieniła (odcisk "native"),
# pobiera samą stronę (plan-www.zip), w przeciwnym razie całe Plan.apk.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Testy
        run: npm ci && npm test

      - name: Numer wersji i paczka ze stroną
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          FEEDBACK_IMG_TOKEN: ${{ secrets.FEEDBACK_IMG_TOKEN }}
        run: |
          # klucz do zgłoszeń (tylko Issues tego repo) trafia do apki dopiero przy budowaniu
          printf "export const FEEDBACK_TOKEN = '%s';\nexport const FEEDBACK_IMG_TOKEN = '%s';\n" "$FEEDBACK_TOKEN" "$FEEDBACK_IMG_TOKEN" > www/config.js
          echo "klucz do zgłoszeń: ${FEEDBACK_TOKEN:+jest}"
          echo "klucz do zrzutów: ${FEEDBACK_IMG_TOKEN:+jest}"
          NATIVE=$(git ls-files android package.json package-lock.json capacitor.config.json | sort | xargs sha256sum | sha256sum | cut -c1-12)
          printf '{"build": %s, "sha": "%s", "date": "%s", "native": "%s"}\n' "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%MZ)" "$NATIVE" > www/build.json
          cat www/build.json
          echo "NATIVE=$NATIVE" >> "$GITHUB_ENV"
          (cd www && zip -qrX ../plan-www.zip .)
          ls -la plan-www.zip

      - name: Stały klucz podpisu (aktualizacje bez odinstalowywania)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
          if [ -n "$ANDROID_USER_HOME" ]; then mkdir -p "$ANDROID_USER_HOME" && cp ci/debug.keystore "$ANDROID_USER_HOME/debug.keystore"; fi

      - name: Build APK
        run: |
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          cd android
          chmod +x gradlew
          # podpis zawsze stałym kluczem z ci/ (bez tego Gradle na serwerze tworzył przy każdym buildzie
          # nowy klucz i aktualizacja APK kończyła się błędem „signatures do not match”)
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/ci/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/debug/app-debug.apk ../Plan.apk
          ls -la ../Plan.apk
          # sprawdzenie: APK musi być podpisane kluczem z ci/ (inaczej telefony nie przyjmą aktualizacji)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          WANT=$(keytool -list -v -keystore ../ci/debug.keystore -storepass android | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          GOT=$("$APKSIGNER" verify --print-certs ../Plan.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "podpis: $GOT (oczekiwany $WANT)"
          [ "$GOT" = "$WANT" ]

      - name: Przesuń tag latest na ten commit
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Wydanie "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Plan 0.1.${GITHUB_RUN_NUMBER}

          Pobierz Plan.apk na telefonie i zainstaluj. Później apka aktualizuje się sama: Ustawienia → Aktualizuj.

          build: ${GITHUB_RUN_NUMBER}
          native: ${NATIVE}"
          # podmiana bez przerwy: najpierw nowy plik pod inną nazwą, potem zamiana nazw
          swap() {
            cp "$1" "nowa-$1"
            gh release upload latest "nowa-$1" --clobber
            OLD=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" -q ".assets[] | select(.name==\"$1\") | .id")
            NEW=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" -q ".assets[] | select(.name==\"nowa-$1\") | .id")
            if [ -n "$OLD" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD"; fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$NEW" -f name="$1" > /dev/null
          }
          if gh release view latest >/dev/null 2>&1; then
            swap plan-www.zip
            swap Plan.apk
            gh release edit latest --title "Plan 0.1.${GITHUB_RUN_NUMBER}" --notes "$NOTES" --latest
          else
            gh release create latest Plan.apk plan-www.zip --title "Plan 0.1.${GITHUB_RUN_NUMBER}" --notes "$NOTES" --latest
          fi
